apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-store
  namespace: book-store
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-store
  template:
    metadata:
      labels:
        app: book-store
    spec:
      containers:
        - name: book-store
          image: samikshabhoir43/book-store:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: book-store
  namespace: book-store
spec:
  type: NodePort
  selector:
    app: book-store
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
